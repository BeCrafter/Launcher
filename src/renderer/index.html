<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launcher</title>
    <!--
      启动期的底色与过渡页样式,**刻意内联在这里**、不依赖打包出来的那 686KB CSS:
        · 过渡页是「窗口还没画出应用」这段时间唯一的内容,不能等外部样式表;
        · `html` 上这一条背景是最后一道保险 —— 任何一帧(包括还没解析到 body 的空帧)
          露出来的都是主题色,而不是浏览器默认的白。
      配色跟 `prefers-color-scheme`:主进程在**建窗之前**就写了 `nativeTheme.themeSource = 设置里的 theme`,
      所以这里的媒体查询拿到的就是「应用生效后的主题」(跟随系统 / 显式浅色 / 显式深色三种都正确),
      不需要读设置、也不依赖 preload 是否可用。
      三处同源(此处 --boot-bg / 主进程 shared/constants 的 BG_* / 应用 base.css 的 --bg)由
      src/main/boot-theme.contract.test.ts 锁住。
    -->
    <style>
      :root {
        --boot-bg: #f6f7fb;
        --boot-fg: #6d7489;
        --boot-accent: #6a58e0;
        --boot-ring: rgba(106, 88, 224, 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #0e0e17;
          --boot-fg: #8e8ea8;
          --boot-accent: #7c6af4;
          --boot-ring: rgba(124, 106, 244, 0.25);
        }
      }
      html {
        background: var(--boot-bg);
      }
      body {
        margin: 0;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--boot-bg);
        font-family: system-ui, sans-serif;
      }
      .boot-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid var(--boot-ring);
        border-top-color: var(--boot-accent);
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-text {
        color: var(--boot-fg);
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      .boot-fail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 0 24px;
        text-align: center;
      }
      .boot-fail-title {
        color: var(--boot-fg);
        font-size: 13px;
        font-weight: 600;
      }
      .boot-fail-hint {
        color: var(--boot-fg);
        font-size: 12px;
        opacity: 0.85;
      }
      .boot-fail-btn {
        margin-top: 4px;
        padding: 6px 14px;
        border: 1px solid var(--boot-ring);
        border-radius: 8px;
        background: transparent;
        color: var(--boot-accent);
        font-size: 12px;
        cursor: pointer;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!--
      启动过渡页(替换时机由 src/renderer/src/boot/splash.ts 的 useBootSplash 负责:
      在 React 首次 commit 的 useLayoutEffect 里移除 —— 与应用 DOM 落在同一帧,
      因此不存在「过渡页已摘、应用未画」的空窗)。
    -->
    <div id="boot-splash">
      <div class="boot-spinner"></div>
      <div class="boot-text">Launcher 启动中…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      启动期的两件事都必须由这段 **classic 内联脚本**(不经过打包)负责:
        ① 告诉主进程「过渡页真的画出来了 / 应用真的画出来了」—— 主进程据此决定何时把窗口显示出来
           (窗口一旦可见,屏幕上必须是这两者之一,绝不能是未绘制的底色);
           双 rAF = 至少有一帧已提交给合成器,这是「马上 show 出去的那一帧里有东西」的唯一证明。
        ② 兜底:8s 后界面还没起来(bundle 没加载成功/被系统拦截)就把过渡页换成可点的失败提示,
           而不是永远停在转圈 —— 这段脚本本身不依赖打包产物,所以它是最后一道。
    -->
    <script>
      ;(function () {
        var api = window.launcher
        var notify = function (phase) {
          try {
            if (api && typeof api.notifyBootPainted === 'function') api.notifyBootPainted(phase)
          } catch (err) {
            /* 上报失败不影响界面:主进程侧还有 watchdog 兜底 */
          }
        }
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            notify('splash')
            // 过渡页被摘除 = 应用已首次 commit(见 renderer/src/boot/splash.ts)
            var splash = document.getElementById('boot-splash')
            if (!splash || !window.MutationObserver) return
            var observer = new MutationObserver(function () {
              if (document.getElementById('boot-splash')) return
              observer.disconnect()
              notify('app')
            })
            observer.observe(document.body, { childList: true })
          })
        })

        window.setTimeout(function () {
          var splash = document.getElementById('boot-splash')
          if (!splash || splash.dataset.failed === '1') return
          splash.dataset.failed = '1'
          splash.textContent = ''
          var box = document.createElement('div')
          box.className = 'boot-fail'
          box.setAttribute('role', 'alert')
          var title = document.createElement('div')
          title.className = 'boot-fail-title'
          title.textContent = 'Launcher 启动失败'
          var hint = document.createElement('div')
          hint.className = 'boot-fail-hint'
          hint.textContent = '界面资源没能加载完成（安装可能不完整，或被系统安全策略拦截）'
          var btn = document.createElement('button')
          btn.type = 'button'
          btn.className = 'boot-fail-btn'
          btn.textContent = '重新加载'
          btn.addEventListener('click', function () {
            window.location.reload()
          })
          box.appendChild(title)
          box.appendChild(hint)
          box.appendChild(btn)
          splash.appendChild(box)
        }, 8000)
      })()
    </script>
  </body>
</html>
