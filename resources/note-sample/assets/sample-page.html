<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>本地网页示例</title>
    <style>
      body {
        margin: 0;
        padding: 28px;
        font: 14px/1.7 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        color: #2a2f45;
        background: #f6f7fb;
      }
      h1 { margin: 0 0 6px; font-size: 17px; }
      p { margin: 0 0 10px; color: #6d7489; }
      code {
        background: #eceefa;
        border-radius: 4px;
        padding: 1px 5px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>这是一个本地网页</h1>
    <p>
      它躺在笔记目录的 <code>assets/</code> 里，用 <code>```embed</code> 围栏嵌进来 ——
      <strong>不发任何网络请求</strong>。
    </p>
    <p>换成网址（https://…）就会联网去取，那是另一条路。</p>
  </body>
</html>
