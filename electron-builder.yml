appId: com.becrafter.launcher
productName: Launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # 仅打包 v2 星际火箭（项目唯一图标）；v1 rocketOrbit 仅作仓库备份不进包
  - from: resources/logo/rocketOrbit2
    to: logo
asar: true
# Electron 自带 220 个语言包（实测 49MB），实际只用中英三种；裁掉其余省 ~47MB
electronLanguages:
  - en
  - zh_CN
  - zh_TW
# 发布产物命名：Launcher-0.1.0-arm64.zip / .dmg —— install.sh 与 Homebrew cask 依赖此格式
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  # 发布产物；build-app.mjs 的 --dir 会整体替换此列表（builder.js:51），故 build:app 仍只出解包目录
  target:
    - dmg
    - zip
  icon: build/icon.icns
  darkModeSupport: true
  minimumSystemVersion: "12.0"
