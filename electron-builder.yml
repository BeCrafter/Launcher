appId: com.becrafter.launcher
productName: Launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # 仅打包 v2 星际火箭（项目唯一图标）；v1 rocketOrbit 仅作仓库备份不进包
  - from: resources/logo/rocketOrbit2
    to: logo
asar: true
# Electron 自带 220 个语言包（实测 49MB），实际只用中英三种；裁掉其余省 ~47MB
electronLanguages:
  - en
  - zh_CN
  - zh_TW
# 产物命名：Launcher-<版本>-<架构>.{zip,dmg}
# 两条安装通道（curl 脚本 scripts/install.sh、Homebrew cask packaging/homebrew/）都只消费 .zip；
# .dmg 是额外产物，不作为推荐安装路径
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  # build-app.mjs 的 --dir 会整体替换此列表（builder.js:51），故 build:app 仍只出解包目录
  # zip = 两条安装通道的产物；dmg = 额外产物（手动安装用，非推荐路径）
  target:
    - dmg
    - zip
  icon: build/icon.icns
  darkModeSupport: true
  minimumSystemVersion: "12.0"
