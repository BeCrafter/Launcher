appId: com.becrafter.launcher
productName: Launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # 仅打包 v2 星际火箭（项目唯一图标）；v1 rocketOrbit 仅作仓库备份不进包
  - from: resources/logo/rocketOrbit2
    to: logo
asar: true
mac:
  category: public.app-category.developer-tools
  target: dir
  icon: build/icon.icns
  darkModeSupport: true
  minimumSystemVersion: "12.0"
