appId: com.becrafter.launcher
productName: Launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/logo
    to: logo
asar: true
mac:
  category: public.app-category.developer-tools
  target: dir
  icon: build/icon.icns
  darkModeSupport: true
  minimumSystemVersion: "12.0"
